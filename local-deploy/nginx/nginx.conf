# =============================================================================
# Merkoteks LAN Reverse Proxy
# port 80 → frontend static (/) + backend proxy (/api)
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Maks dosya yükleme boyutu (Excel + belge upload'ları için)
    client_max_body_size 50m;

    # Sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- Backend API proxy (long timeout for PDF generation) ---------------
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # ---- SPA static + fallback ---------------------------------------------
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;

        # Hashli asset'ler için uzun cache
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }
    }
}
